name: Android CI

# Builds the debug APK on every push/PR to main, on demand, and on version
# tags (v*). A tag push also runs the release job below, which takes this
# job's already-built APK and publishes it as a GitHub Release instead of
# leaving it as an Actions artifact you have to dig through the run history
# for.
#
# Two known CI-specific gaps this workflow works around:
#   1. This repo has no checked-in gradle-wrapper.jar (see README.md) —
#      Gradle is installed directly and used to regenerate it before
#      falling back to the normal ./gradlew.
#   2. GitHub-hosted Ubuntu runners no longer reliably ship a writable
#      Android SDK setup (sdkmanager may be missing/immutable on the
#      default image), so the SDK and its licenses are set up explicitly
#      here rather than assumed to already be in place.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Regenerate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: statushd-lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # Only runs on a version-tag push (v1.5.3, v1.6.0, ...), never on plain
  # main pushes or PRs. Reuses the APK the build job above already produced
  # rather than building it a second time.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: statushd-lite-debug-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true